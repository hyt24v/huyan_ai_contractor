name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsonpath-plus 要求 Node >= 22，Node 20 下 npm ci 会失败/卡住
          node-version: 22
          cache: npm

      # Universal 2 二进制：同时内嵌 arm64 + x86_64，一个 dmg 通吃两种芯片
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # lockfile 已指向公共 registry.npmjs.org；网络抖动时重试一次
      - name: Install frontend dependencies
        run: |
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
          test -x node_modules/.bin/tsc
          test -x node_modules/.bin/tauri

      - name: Check frontend build
        run: npm run build

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI包工头 ${{ github.ref_name }}'
          releaseBody: |
            自动构建的 macOS Universal 安装包（Apple Silicon + Intel 通用）。

            下载 `.dmg` 后打开，把「AI包工头」拖入「应用程序」即可。
            首次打开如提示未验证开发者：macOS 15+ 请到「系统设置 → 隐私与安全性 → 仍要打开」；
            或执行 `xattr -cr "/Applications/AI包工头.app"` 后重新打开。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          # GitHub 会把非 ASCII 资产名改写成 "AI._..."，导致 tauri-action 无法识别已存在资产而重跑失败；用固定 ASCII 名保证幂等
          assetNamePattern: 'AI-Baogongtou_[version]_[platform]_[arch][ext]'
          args: --target universal-apple-darwin
