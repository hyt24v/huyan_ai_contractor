name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsonpath-plus 要求 Node >= 22，Node 20 下 npm ci 会失败/卡住
          node-version: 22
          cache: npm

      # Universal 2 二进制：同时内嵌 arm64 + x86_64，一个 dmg 通吃两种芯片
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # lockfile 已指向公共 registry.npmjs.org；网络抖动时重试一次
      - name: Install frontend dependencies
        run: |
          # npm 自带的 fetch 重试默认太保守，runner 网络抖动会触发
          # "Exit handler never called"（npm 自身 bug），先升级到最新 npm 并加大重试
          npm install -g npm@latest
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
          test -x node_modules/.bin/tsc
          test -x node_modules/.bin/tauri

      - name: Check frontend build
        run: npm run build

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新的更新包签名密钥（内容与 ~/.tauri/ai-baogongtou-updater.key 相同）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI包工头 ${{ github.ref_name }}'
          releaseBody: |
            自动构建的 macOS Universal 安装包（Apple Silicon + Intel 通用）。

            下载 `.dmg` 后打开，把「AI包工头」拖入「应用程序」即可。
            首次打开如提示未验证开发者：macOS 15+ 请到「系统设置 → 隐私与安全性 → 仍要打开」；
            或执行 `xattr -cr "/Applications/AI包工头.app"` 后重新打开。
          releaseDraft: false
          # 带 prerelease 后缀的 tag（如 v0.6.0-beta.1）自动标记为 Pre-release，与 main 的正式版区分
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 生成 latest.json + .sig 更新包签名，供应用内更新使用
          includeUpdaterJson: true
          # GitHub 会把非 ASCII 资产名改写成 "AI._..."，导致 tauri-action 无法识别已存在资产而重跑失败；用固定 ASCII 名保证幂等
          assetNamePattern: 'AI-Baogongtou_[version]_[platform]_[arch][ext]'
          args: --target universal-apple-darwin

      # 把 latest.json 同步到固定 tag `updater` 的滚动 Release：
      # beta 是 Pre-release 不会成为 Latest，应用统一从 updater release 取更新清单，beta/正式共用一条通道
      - name: Publish updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern 'latest.json' --clobber --dir updater-manifest
          gh release view updater --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create updater --repo "${{ github.repository }}" \
              --title 'Updater' --notes '应用内更新清单（自动维护，勿删）' --prerelease
          gh release upload updater updater-manifest/latest.json --clobber --repo "${{ github.repository }}"
